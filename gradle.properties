org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Parchment parameter mappings (https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
neo_version_range=[21.1.0,)
# FML loader range as seen by neoforge.mods.toml; for KFF mods this is the KFF version range
loader_version_range=[5.12,)
kff_version=5.12.0

# Mod
mod_id=packcore
mod_name=Packcore
mod_license=MIT
mod_version=0.1.0
mod_group_id=io.github.veelume.packcore
mod_authors=Veelume
mod_description=Civilization layer for the pack: named places, courier depots, mail, coins and roads.
