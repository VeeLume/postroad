org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Parchment parameter mappings (https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
neo_version_range=[21.1.0,)
# FML loader range as seen by neoforge.mods.toml; for KFF mods this is the KFF version range
loader_version_range=[5.12,)
kff_version=5.12.0
# Modrinth version id of Jade 15.10.6+neoforge (1.21.1)
jade_version=eYz2YBGT

# Mod
mod_id=postroad
mod_name=Postroad
mod_license=MIT
mod_version=0.2.1
mod_group_id=io.github.veelume.postroad
mod_authors=Veelume
mod_description=Civilization layer for the pack: named places, courier depots, mail, coins and roads.
# Distant Horizons API (Modrinth 'distanthorizonsapi'); the server runs DH 3.2.0-b, API 7.0.1
dh_api_version=GgrzKRsK
# Modrinth version id of EMI 1.1.24+1.21.1+neoforge (the pack's recipe viewer)
emi_version=5sIPA1To
